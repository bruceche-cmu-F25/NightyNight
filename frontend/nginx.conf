server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy story generation and audio to langgraph-service (k8s internal DNS)
    location /generate {
        proxy_pass         http://langgraph-service:80;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';       # keep alive for SSE
        proxy_buffering    off;                 # stream SSE without buffering
        proxy_cache        off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    location /audio/ {
        proxy_pass       http://langgraph-service:80;
        proxy_buffering  off;
    }

    location /sounds/ {
        proxy_pass       http://langgraph-service:80;
        proxy_buffering  off;
    }

    location /ambient/ {
        proxy_pass       http://langgraph-service:80;
        proxy_buffering  off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
