server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    location /generate {
        proxy_pass            https://nightynight.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header      Host nightynight.onrender.com;
        proxy_http_version    1.1;
        proxy_set_header      Connection '';
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    600s;
        proxy_connect_timeout 60s;
        chunked_transfer_encoding on;
    }

    location /audio/ {
        proxy_pass            https://nightynight.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header      Host nightynight.onrender.com;
        proxy_buffering       off;
    }

    location /sounds/ {
        proxy_pass            https://nightynight.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header      Host nightynight.onrender.com;
        proxy_buffering       off;
    }

    location /ambient/ {
        proxy_pass            https://nightynight.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header      Host nightynight.onrender.com;
        proxy_buffering       off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
